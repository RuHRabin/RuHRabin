<svg xmlns="http://www.w3.org/2000/svg" width="688" height="80" viewBox="0 0 688 80" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="birdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <path id="birdShape" fill="url(#birdGrad)"
      d="M -22,-2 Q -10,-12 -2,-3 Q 0,-5 2,-3 Q 10,-12 22,-2 Q 10,2 2,1 Q 0,4 -2,1 Q -10,2 -22,-2 Z">
      <animate attributeName="d" dur="0.55s" repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
        values="
          M -22,-2 Q -10,-12 -2,-3 Q 0,-5 2,-3 Q 10,-12 22,-2 Q 10,2 2,1 Q 0,4 -2,1 Q -10,2 -22,-2 Z;
          M -22,0 Q -10,-2 -2,-1 Q 0,-1 2,-1 Q 10,-2 22,0 Q 10,2 2,1 Q 0,2 -2,1 Q -10,2 -22,0 Z;
          M -22,2 Q -10,12 -2,3 Q 0,5 2,3 Q 10,12 22,2 Q 10,-2 2,-1 Q 0,-4 -2,-1 Q -10,-2 -22,2 Z;
          M -22,0 Q -10,-2 -2,-1 Q 0,-1 2,-1 Q 10,-2 22,0 Q 10,2 2,1 Q 0,2 -2,1 Q -10,2 -22,0 Z;
          M -22,-2 Q -10,-12 -2,-3 Q 0,-5 2,-3 Q 10,-12 22,-2 Q 10,2 2,1 Q 0,4 -2,1 Q -10,2 -22,-2 Z"/>
    </path>

    <clipPath id="bannerClip">
      <rect x="-92" y="-10" width="184" height="20" rx="10"/>
    </clipPath>
  </defs>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0"
      keyTimes="0;0.03;0.09;0.91;0.97;1" dur="9s" repeatCount="indefinite"/>
    <animateMotion path="M -20,64 Q 344,14 708,64" dur="9s" repeatCount="indefinite" rotate="auto"/>

    <!-- towed welcome banner -->
    <g transform="translate(-140,0)">
      <rect x="-100" y="-12" width="200" height="24" rx="12" fill="#262c31" stroke="#333a40" stroke-width="1"/>
      <g clip-path="url(#bannerClip)">
        <g fill="#f0ece4" font-size="11">
          <animateTransform attributeName="transform" type="translate"
            values="0,4; -650,4" dur="11s" repeatCount="indefinite"/>
          <text x="-84">Welcome! I'm Rabin — a lifelong learner deep in machine learning &amp; simulation.  ·  </text>
          <text x="566">Welcome! I'm Rabin — a lifelong learner deep in machine learning &amp; simulation.  ·  </text>
        </g>
      </g>
    </g>

    <!-- tow line connecting bird to banner -->
    <line x1="-22" y1="0" x2="-40" y2="0" stroke="#22D3EE" stroke-width="1.5" opacity="0.7"/>

    <!-- bird -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0;0,-3;0,0;0,3;0,0" dur="0.55s" repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
      <use href="#birdShape"/>
    </g>
  </g>
</svg>
