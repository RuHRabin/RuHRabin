name: Sync repos into README

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch pinned + recent repos into README.md
        env:
          GH_TOKEN: ${{ secrets.PINNED_REPOS_PAT || secrets.GITHUB_TOKEN }}
          GH_USERNAME: RuHRabin
        run: python3 scripts/update_repos.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: sync repos"
          git push
